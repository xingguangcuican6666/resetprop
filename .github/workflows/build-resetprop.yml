name: Build resetprop

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build-resetprop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build resetprop
        working-directory: jni
        run: |
          ndk-build -j"$(nproc)" APP_ABI=arm64-v8a resetprop

      - name: Upload resetprop artifact
        uses: actions/upload-artifact@v4
        with:
          name: resetprop-arm64-v8a
          path: jni/libs/arm64-v8a/resetprop
          if-no-files-found: error
